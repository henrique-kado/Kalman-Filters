[project]
name = "kalman-filters"
version = "0.1.0"
description = "Kalman filters implemented from scratch with NumPy, from least squares to IMM."
readme = "README.md"
license = "MIT"
authors = [{ name = "Henrique Kado" }]
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "jupytext",
    "pre-commit",
]
book = [
    "jupyter-book",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kalman"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# No "N" (pep8-naming): uppercase math names such as P, Q, R, A, C are intended.
select = ["E", "F", "I", "UP", "B", "NPY"]

[tool.jupytext]
formats = "ipynb,md:myst"
